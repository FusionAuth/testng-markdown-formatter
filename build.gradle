plugins {
  id "java-library"
  id "maven-publish"
  id "signing"
}

group = "io.fusionauth"
version = "1.3.1"

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
  withSourcesJar()
  withJavadocJar()
}

dependencies {
  api libs.testng

  // testNG seems to depend on this
  runtimeOnly libs.guice

  testImplementation libs.mockito.core
}

tasks.named("test") {
  useTestNG()
  // Like Savant's TestNG plugin, only run classes named *Test. The testclasses package holds deliberately failing
  // fixtures that the reporter tests run themselves.
  filter {
    includeTestsMatching "*Test"
  }
}

tasks.withType(Javadoc).configureEach {
  options.addStringOption("Xdoclint:none", "-quiet")
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
      pom {
        licenses {
          license {
            name = "ApacheV2_0"
            url = "https://www.apache.org/licenses/LICENSE-2.0"
          }
        }
      }
    }
  }
  repositories {
    maven {
      url = gradle.codeArtifactUrl
      credentials {
        username = "aws"
        password = gradle.codeArtifactToken.get()
      }
    }
  }
}

// Published artifacts must be signed with a local gpg key. The key name is personal config: set
// signing.gnupg.keyName=<fingerprint> in ~/.gradle/gradle.properties (never in this repo) and unlock the key in gpg-agent first.
// Signing is only required for a remote publish; build, test and publishToMavenLocal work without a key configured.
signing {
  setRequired { gradle.taskGraph.allTasks.any { it instanceof PublishToMavenRepository } }
  if (project.hasProperty("signing.gnupg.keyName")) {
    useGpgCmd()
  }
  sign publishing.publications.mavenJava
}
